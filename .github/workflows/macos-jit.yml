name: macOS JIT

# The JIT's macOS path (MAP_JIT pages, per-thread write protection on Apple silicon) cannot be
# exercised anywhere else: this runs it on both architectures, signed as an embedder ships it,
# and runs the JIT's differential tests on aarch64.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  dom:
    name: DOM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: DOM, React and security regressions
        run: cargo test --locked -p verve-dom --no-fail-fast

  probe:
    name: Probe (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Rosetta
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - name: Build the probe
        run: cargo build --release --features jit --example jit_probe --target ${{ matrix.target }}
      - name: Unsigned, hardened with allow-jit, hardened without it
        run: sh ci/macos/jit-probe.sh target/${{ matrix.target }}/release/examples/jit_probe
      - name: Code goes in MAP_JIT pages and runs
        working-directory: boa
        run: cargo test --release -p boa_engine --features jit --lib vm::jit::memory --target ${{ matrix.target }}

  tests:
    name: JIT tests (aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: POSIX directory descriptors and atomic storage writes
        run: cargo test --release --test fs
      - name: Verve's JIT tests, forced and at defaults
        run: |
          VERVE_JIT_THRESHOLD=0 cargo test --release --features jit --test jit
          cargo test --release --features jit --test jit
      - name: Boa's JIT tests (differential and generated programs)
        working-directory: boa
        run: cargo test --release -p boa_engine --features jit --lib vm::jit
