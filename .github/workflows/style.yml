name: Style

# The rules in docs/electron/style.md a machine can check: formatting, clippy with no warnings,
# and scripts/style-check.sh (file length ratchet, one toolkit, no stray macros or TODOs).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # verve-gpui builds GPUI's Linux backend; these are the system libraries Zed's own CI installs
      # for it (windowing and fonts).
      - name: GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Style rules
        run: bash scripts/style-check.sh
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
