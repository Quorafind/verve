[package]
name = "verve"
version = "0.1.0"
edition = "2024"
description = "Verve, a JavaScript runtime for live plugins: Boa with the web's and Node's everyday APIs in Rust, and isolates — a runtime on a thread of its own, sent jobs, answering with events and snapshots, failing alone."
publish = false

# A Node-shaped place for a plugin's main.js to run: CommonJS `require`, `module.exports`,
# timers, `console`, `process`. Every one of them is a native Rust function on Boa, an
# interpreter written in Rust; nothing here is JavaScript written to stand in for Node.

# `verve run`: a script as a process of its own, under the permission model.
[[bin]]
name = "verve"
path = "src/bin/verve.rs"

[workspace]
# Boa keeps its own workspace, as upstream has it, so `git subtree pull` stays a plain merge.
exclude = ["boa"]

[dependencies]
boa_engine = { version = "=0.22.0", default-features = false, features = ["annex-b"] }
boa_gc = "=0.22.0"
web-time = "1.1"
# `URL` and `URLSearchParams`: the WHATWG URL standard.
url = "2.5"
form_urlencoded = "1.2"
# `crypto`: the system's randomness, and the digests `crypto.subtle` answers.
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"
# Node's `crypto` and `crypto.subtle`: RustCrypto's digests, key derivation, the AES block
# cipher and GHASH — GCM, CBC, CTR and the key wrap are built on those in `crypto.rs`.
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
scrypt = { version = "0.11", default-features = false }
aes = "0.8"
ghash = "0.5"
# `zlib` and the compression streams: deflate by miniz_oxide, in Rust, and brotli.
flate2 = "1"
crc32fast = "1"
brotli = "8"
# IndexedDB's databases, kept on disk as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `Intl.Segmenter`: grapheme clusters, words and sentences, by Unicode's rules (UAX #29).
unicode-segmentation = "1.12"
# The zone the system's clock is set to, by its IANA name: `Intl`'s default `timeZone`.
iana-time-zone = "0.1"
# WebAssembly, run by an interpreter written in Rust.
wasmi = "0.35"

# Permissioned TCP/UDP: one portable readiness reactor, with kernel socket options.
mio = { version = "1.2", features = ["net", "os-poll"] }
# TCP keepalive and datagram options, without a connection-per-thread runtime.
socket2 = { version = "0.6", features = ["all"] }
# System-configured DNS record queries, confined to the fixed resolver pool.
hickory-resolver = { version = "0.24", features = ["system-config"] }

# TLS client/server handshakes and certificate verification within the mio reactor.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# Native trust anchors; loaded off the JavaScript thread.
rustls-native-certs = "0.8"
# Node's PEM ca/cert/key options, parsed without OpenSSL.
rustls-pemfile = "2.2"
# Decode getPeerCertificate metadata; TLS verification itself remains rustls/webpki.
x509-parser = "0.18"

# Incremental HTTP/1 head parsing without a blocking HTTP client or async runtime.
httparse = "1.10"

# RFC 6455 client framing/validation over existing native Duplex sockets, without TLS duplication.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# `module.stripTypeScriptTypes`: oxc's TypeScript parser, for the spans the strip mode blanks
# out, and its transformer and printer for the transform mode. 0.146 is the newest oxc that
# builds on Rust 1.95; later releases ask for 1.96 and up.
oxc_allocator = "0.146"
oxc_ast = "0.146"
oxc_ast_visit = "0.146"
oxc_codegen = "0.146"
oxc_diagnostics = "0.146"
oxc_parser = "0.146"
oxc_semantic = "0.146"
oxc_span = "0.146"
oxc_transformer = "0.146"

# `verve::npm`: installing a package.json's dependencies without npm. A blocking HTTP client
# on the rustls Verve's network stack already carries, and tar for the tarballs (gzip is flate2).
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "gzip"], optional = true }
tar = { version = "0.4.44", default-features = false, optional = true }
base64 = { version = "0.23", optional = true }

[features]
default = ["npm"]
# The npm installer: an embedder that installs no packages leaves out its HTTP client.
npm = ["dep:ureq", "dep:tar", "dep:base64"]

[dev-dependencies]
serde_json = "1"
# WebAssembly tests write their modules as text.
wat = "1.251"
# TLS tests sign a localhost certificate as they run: the repository keeps no private key.
rcgen = "0.14"

# Boa as Verve carries it in `boa/`: 0.22.0 with the fixes listed in `boa/SU.md`, and the
# interrupt handle isolates stop a script with. An embedder takes Boa from this repository too,
# so its crates and Verve's always agree.
[patch.crates-io]
boa_ast = { path = "boa/core/ast" }
boa_engine = { path = "boa/core/engine" }
boa_gc = { path = "boa/core/gc" }
boa_interner = { path = "boa/core/interner" }
boa_macros = { path = "boa/core/macros" }
boa_parser = { path = "boa/core/parser" }
boa_string = { path = "boa/core/string" }

# The interpreter unoptimised is several times slower, in tests as anywhere.
[profile.dev.package.boa_engine]
opt-level = 3
[profile.dev.package.boa_parser]
opt-level = 3
[profile.dev.package.boa_ast]
opt-level = 3
[profile.dev.package.boa_gc]
opt-level = 3
[profile.dev.package.boa_interner]
opt-level = 3
[profile.dev.package.boa_string]
opt-level = 3
[profile.dev.package.regress]
opt-level = 3
[profile.dev.package.wasmi]
opt-level = 3
