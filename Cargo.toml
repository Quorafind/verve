[package]
name = "verve"
version = "0.1.0"
edition = "2024"
description = "Verve, a JavaScript runtime for live plugins: Boa with the web's and Node's everyday APIs in Rust, and isolates — a runtime on a thread of its own, sent jobs, answering with events and snapshots, failing alone."
publish = false

# A Node-shaped place for a plugin's main.js to run: CommonJS `require`, `module.exports`,
# timers, `console`, `process`. Every one of them is a native Rust function on Boa, an
# interpreter written in Rust; nothing here is JavaScript written to stand in for Node.

# `verve run`: a script as a process of its own, under the permission model.
[[bin]]
name = "verve"
path = "src/bin/verve.rs"

[workspace]
# `verve-dom`: a document for the realm, opt-in — see its README.
members = ["crates/verve-dom", "crates/verve-asar"]
# Boa keeps its own workspace, as upstream has it, so `git subtree pull` stays a plain merge.
exclude = ["boa"]

# The stricter lints every new crate takes (`[lints] workspace = true`); see docs/electron/style.md.
# `verve` and `verve-dom` take them once the refactor gates have cleaned them up.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
too_many_lines = "warn"
undocumented_unsafe_blocks = "warn"

[dependencies]
boa_engine = { version = "=0.22.0", default-features = false, features = ["annex-b"] }
boa_gc = "=0.22.0"
web-time = "1.1"
# `URL` and `URLSearchParams`: the WHATWG URL standard.
url = "2.5"
form_urlencoded = "1.2"
# `crypto`: the system's randomness, and the digests `crypto.subtle` answers.
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"
# Node's `crypto` and `crypto.subtle`: RustCrypto's digests, key derivation, the AES block
# cipher and GHASH — GCM, CBC, CTR and the key wrap are built on those in `crypto.rs`.
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
scrypt = { version = "0.11", default-features = false }
aes = "0.8"
ghash = "0.5"
# `zlib` and the compression streams: deflate by miniz_oxide, in Rust, and brotli.
flate2 = "1"
crc32fast = "1"
brotli = "8"
# IndexedDB's databases, kept on disk as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `Intl.Segmenter`: grapheme clusters, words and sentences, by Unicode's rules (UAX #29).
unicode-segmentation = "1.12"
# The zone the system's clock is set to, by its IANA name: `Intl`'s default `timeZone`.
iana-time-zone = "0.1"
# WebAssembly, run by an interpreter written in Rust. Only with the `wasm` feature.
wasmi = { version = "0.35", optional = true }

# Permissioned TCP/UDP: one portable readiness reactor, with kernel socket options; `os-ext` for
# the pipes of child processes (`mio::windows::NamedPipe`, `mio::net::UnixStream` pairs).
mio = { version = "1.2", features = ["net", "os-poll", "os-ext"] }
# TCP keepalive and datagram options, without a connection-per-thread runtime.
socket2 = { version = "0.6", features = ["all"] }
# System-configured DNS record queries, confined to the fixed resolver pool. Only with the
# `dns-records` feature; `dns.lookup` is the system resolver and needs none of it.
hickory-resolver = { version = "0.24", features = ["system-config"], optional = true }

# TLS client/server handshakes and certificate verification within the mio reactor.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# Native trust anchors; loaded off the JavaScript thread.
rustls-native-certs = "0.8"
# Node's PEM ca/cert/key options, parsed without OpenSSL.
rustls-pemfile = "2.2"
# Decode getPeerCertificate metadata; TLS verification itself remains rustls/webpki. Only with
# the `x509` feature.
x509-parser = { version = "0.18", optional = true }

# Incremental HTTP/1 head parsing without a blocking HTTP client or async runtime.
httparse = "1.10"

# RFC 6455 client framing/validation over existing native Duplex sockets, without TLS duplication.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# `module.stripTypeScriptTypes`: oxc's TypeScript parser, for the spans the strip mode blanks
# out, and its transformer and printer for the transform mode. 0.146 is the newest oxc that
# builds on Rust 1.95; later releases ask for 1.96 and up. Only with the `typescript` feature.
oxc_allocator = { version = "0.146", optional = true }
oxc_ast = { version = "0.146", optional = true }
oxc_ast_visit = { version = "0.146", optional = true }
oxc_codegen = { version = "0.146", optional = true }
oxc_diagnostics = { version = "0.146", optional = true }
oxc_parser = { version = "0.146", optional = true }
oxc_semantic = { version = "0.146", optional = true }
oxc_span = { version = "0.146", optional = true }
oxc_transformer = { version = "0.146", optional = true }

# `verve::npm`: installing a package.json's dependencies without npm. A blocking HTTP client
# on the rustls Verve's network stack already carries, and tar for the tarballs (gzip is flate2).
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "gzip"], optional = true }
tar = { version = "0.4.44", default-features = false, optional = true }
base64 = { version = "0.23", optional = true }

# The code cache's folder: private to its owner; signals and descriptors for child processes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }

[features]
# Every API Verve carries by default. An Electron build turns off what its compatibility target
# does not need, one switch at a time; see `docs/electron/size.md`.
default = ["npm", "typescript", "wasm", "dns-records", "x509", "brotli"]
# The npm installer: an embedder that installs no packages leaves out its HTTP client.
npm = ["dep:ureq", "dep:tar", "dep:base64"]
# `module.stripTypeScriptTypes`: oxc's TypeScript parser and transformer. Without it the
# function is still there and throws `ERR_NOT_SUPPORTED`.
typescript = [
    "dep:oxc_allocator",
    "dep:oxc_ast",
    "dep:oxc_ast_visit",
    "dep:oxc_codegen",
    "dep:oxc_diagnostics",
    "dep:oxc_parser",
    "dep:oxc_semantic",
    "dep:oxc_span",
    "dep:oxc_transformer",
]
# `WebAssembly`, run by wasmi. Without it there is no `WebAssembly` global.
wasm = ["dep:wasmi"]
# `dns.resolve4/6/Txt/Srv`: record queries by hickory. Without it only `dns.lookup` answers.
dns-records = ["dep:hickory-resolver"]
# `getPeerCertificate`'s subject, issuer, validity and SANs, by x509-parser. Without it the
# certificate keeps `raw` and its fingerprints, as documented in `docs/electron/size.md`.
x509 = ["dep:x509-parser"]
# `zlib.brotliCompress`: brotli's encoder. Decoding (`fetch`'s `br`, `zlib.brotliDecompress`)
# stays, so the crate stays; the feature only keeps the encoder out of the link.
brotli = []
# Boa's baseline JIT: hot functions run as native code (see `docs/jit.md`). Switched off at
# runtime with `VERVE_JIT=0` or `Runtime::set_jit_enabled(false)`.
jit = ["boa_engine/jit"]
# Every runtime made with `Runtime::new` keeps a code cache in `VERVE_CODE_CACHE`, as `verve run`
# does: for running whole test suites with one. An embedder sets its directory itself.
code-cache-env = []

[[example]]
name = "jit_probe"
required-features = ["jit"]

[dev-dependencies]
serde_json = "1"
# WebAssembly tests write their modules as text.
wat = "1.251"
# TLS tests sign a localhost certificate as they run: the repository keeps no private key.
rcgen = "0.14"

# Boa as Verve carries it in `boa/`: 0.22.0 with the fixes listed in `boa/SU.md`, and the
# interrupt handle isolates stop a script with. An embedder takes Boa from this repository too,
# so its crates and Verve's always agree.
[patch.crates-io]
boa_ast = { path = "boa/core/ast" }
boa_engine = { path = "boa/core/engine" }
boa_gc = { path = "boa/core/gc" }
boa_interner = { path = "boa/core/interner" }
boa_macros = { path = "boa/core/macros" }
boa_parser = { path = "boa/core/parser" }
boa_string = { path = "boa/core/string" }

# The interpreter unoptimised is several times slower, in tests as anywhere.
[profile.dev.package.boa_engine]
opt-level = 3
[profile.dev.package.boa_parser]
opt-level = 3
[profile.dev.package.boa_ast]
opt-level = 3
[profile.dev.package.boa_gc]
opt-level = 3
[profile.dev.package.boa_interner]
opt-level = 3
[profile.dev.package.boa_string]
opt-level = 3
[profile.dev.package.regress]
opt-level = 3
[profile.dev.package.wasmi]
opt-level = 3
# The JIT's code generator, so a dev build compiles hot functions in microseconds, not
# milliseconds (only built with the `jit` feature).
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3

# A shipped binary is one codegen unit with fat LTO: the linker drops everything no native table
# reaches, which is most of a feature-gated API. `panic` stays `unwind` on purpose: an isolate
# catches a panic so only it dies (`src/isolate.rs`), which `panic = "abort"` would take away.
# Verve's own glue and the dependencies are built for size (2.6 MB less than opt-level 3, for
# 5% on the interpreter benchmark in `docs/electron/size.md`); the interpreter, its parser, the
# regex engine, wasmi and the JIT's code generator are hot paths and keep opt-level 3.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"

[profile.release.package.boa_engine]
opt-level = 3
[profile.release.package.boa_parser]
opt-level = 3
[profile.release.package.boa_ast]
opt-level = 3
[profile.release.package.boa_gc]
opt-level = 3
[profile.release.package.boa_interner]
opt-level = 3
[profile.release.package.boa_string]
opt-level = 3
[profile.release.package.regress]
opt-level = 3
[profile.release.package.wasmi]
opt-level = 3
[profile.release.package.cranelift-codegen]
opt-level = 3
[profile.release.package.cranelift-frontend]
opt-level = 3
[profile.release.package.regalloc2]
opt-level = 3

# What the npm platform package ships (P40): a release under a name of its own, so a size check
# can build the shipping profile without changing the release one.
[profile.dist]
inherits = "release"
