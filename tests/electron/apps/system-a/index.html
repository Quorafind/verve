<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>P14 system-a</title>
    <style>
      body { font: 14px sans-serif; margin: 16px; }
      button { margin: 4px; }
      pre { background: #eee; padding: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>P14 system-a: press each button</h1>
    <div id="buttons"></div>
    <pre id="out">Nothing pressed yet.</pre>
    <script>
      const names = ['open-file', 'open-directory', 'save-file', 'message-box', 'message-box-sync', 'error-box', 'notification', 'open-external', 'show-item', 'trash-item', 'clipboard', 'theme', 'screen', 'image', 'power-save', 'safe-storage'];
      for (const name of names) {
        const button = document.createElement('button');
        button.textContent = name;
        button.onclick = async () => {
          document.getElementById('out').textContent = `${name} ...`;
          const result = await window.run(name);
          document.getElementById('out').textContent = `${name}: ${JSON.stringify(result, null, 1)}`;
        };
        document.getElementById('buttons').appendChild(button);
      }
    </script>
  </body>
</html>
