<!doctype html>
<html><head><meta charset="utf-8"><title>forms</title>
<style>
  body { margin: 8px; background: #fff; font: 13.3333px Arial }
  .row { height: 32px; white-space: nowrap }
</style></head>
<body>
<div class="row"><b id="m1" style="display:inline-block;width:0;height:0"></b><input id="text" value="Hello"> <input id="password" type="password" value="secret"> <input id="empty" placeholder="Search"></div>
<div class="row"><b id="m2" style="display:inline-block;width:0;height:0"></b><input id="checkbox" type="checkbox"> <input id="checked" type="checkbox" checked> <input id="radio" type="radio"> <input id="radio-on" type="radio" checked> <input id="range" type="range" value="30"> <input id="color" type="color" value="#3366cc"></div>
<div class="row"><b id="m3" style="display:inline-block;width:0;height:0"></b><button id="button">Go</button> <input id="submit" type="submit"> <select id="select"><option>One</option><option>Two</option></select> <input id="number" type="number"></div>
<div class="row"><b id="m4" style="display:inline-block;width:0;height:0"></b><progress id="progress" value="0.5"></progress> <meter id="meter" value="0.6"></meter> <input id="date" type="date"> <input id="file" type="file"></div>
<div class="row" style="height:48px"><b id="m5" style="display:inline-block;width:0;height:0"></b><textarea id="textarea">multi
line</textarea> <select id="list" multiple><option>One</option><option>Two</option><option>Three</option></select></div>
<div class="row" style="height:auto"><span id="t-button">Go</span> <span id="t-submit">Submit</span> <span id="t-select">One</span> <span id="t-list">Three</span> <span id="t-textarea" style="font-family:monospace">00000000000000000000</span></div>
</body></html>
